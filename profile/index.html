<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Fuzz about your friends on FuzzBuzz. Discover new posts and images and build networks based on your own interests."
    />
    <meta name="author" content="Kim-Andre Kårdal" />
    <meta property="og:title" content="Fuzzbuzz" />
    <meta
      property="og:description"
      content="Fuzzbuzz let's you buzz about your friends fuzz. Connect with your friends and build a buzzy network with others. Reach new levels of fuzzing or buzzing."
    />
    <meta property="og:image" content="/images/fb-favicon.png" />
    <meta property="og:url" content="https://fuzzbuzz.netlify.app/" />
    <meta property="og:type" content="website" />
    <title>Profile | FuzzBuzz</title>
    <link rel="stylesheet" href="/css/output.css" />
    <link rel="icon" href="/images/fb-favicon.png" />
    <script src="/js/script.js" defer></script>
    <script src="/js/darkMode.js" defer></script>
    <script src="/js/app.js" type="module"></script>
    <script src="/js/events/logoutHandler.js" type="module"></script>
  </head>
  <!--For your information: I built this webpage with dark theme in mind. So, when I decided to try out dark/light mode, I had to apply light colors after dark colors, but still use "dark:" because it's function is like a light-switch. I cannot use "light:" e.g. Can be confusing to read, but I am aware of it.-->

  <body class="bg-bgBody dark:bg-white 100vh">
    <!-- Header -->
    <header
      class="bg-customOrange dark:bg-indigo-300 shadow-md fixed w-full top-0 z-50"
    >
      <nav class="container mx-auto">
        <div class="flex justify-between">
          <a href="/feed/index.html" class="flex items-center py-4 px-2">
            <img
              src="/images/fuzzbuzz-logo.png"
              alt="Fuzzbuzz logo"
              class="w-36"
            />
          </a>
          <div class="hidden md:flex items-center space-x-2">
            <a
              href="/profile.html"
              class="py-4 px-2 text-black font-semibold border-b-2 border-customTeal"
              >Profile</a
            >
            <a
              href="/feed/index.html"
              class="py-4 px-2 text-black font-semibold"
              >Feed</a
            >
            <img
              src="/images/profileimg-some.png"
              alt="profile image"
              class="w-10"
            />
          </div>

          <!--Mobile navbar-->
          <div id="menu-btn" class="md:hidden pr-4 pt-4">
            <img
              src="/images/icons8-menu-50.png"
              class="w-8"
              alt="mobile menu icon"
            />
          </div>
        </div>
        <div
          id="mobileNav"
          class="container bg-bgBody dark:bg-indigo-200 py-10 text-white dark:text-black flex justify-center items-center mx-auto w-full hidden"
        >
          <ul
            class="mx-auto justify-center items-center uppercase text-center gap-3"
          >
            <li
              class="p-2 mb-4 ring-offset-2 ring-2 focus:ring-2 rounded-md ring-blue-400 text-gray-400 dark:text-gray-700"
            >
              <a href="/profile.html">Profile</a>
            </li>
            <li class="p-2 mb-4 ring-offset-2 ring-2 focus:ring-2 rounded-md">
              <a href="/feed/index.html">Feed</a>
            </li>
            <li
              class="p-2 mb-4 ring-offset-2 ring-2 focus:ring-2 rounded-md ring-red-600"
            >
              <a>Log out</a>
            </li>
          </ul>
        </div>
      </nav>
    </header>
    <main
      class="flex flex-col md:flex-row justify-center mt-32 min-h-screen w-11/12 lg:w-3/4 xl:w-2/3 mx-auto gap-4"
    >
      <!-- Left Column (User Info) -->
      <aside
        class="bg-customGray dark:bg-indigo-100 p-4 rounded-lg w-full md:w-1/4 flex flex-col items-center space-y-4 h-fit"
      >
        <img
          src="/images/profileimg-some.png"
          alt="profile user image"
          class="rounded-full w-36 h-36"
        />
        <div class="text-white dark:text-black p-2 w-full text-center border-b">
          <h1>Welcome</h1>
        </div>
        <div class="text-white dark:text-black text-left p-4 w-full">
          <div class="border-b w-20 py-3"></div>
          <div class="w-full flex">
            <p class="text-white dark:text-black pr-2">Dark/Light mode</p>
            <button id="theme-toggle" class="w-6 flex items-center">
              <img
                id="sun"
                src="/images/icons8-sun-50.png"
                alt="sun lightmode"
              />
              <img
                id="moon"
                src="/images/icons8-moon-50.png"
                alt="moon darkmode"
              />
            </button>
          </div>
          <a
            id="logout"
            class="text-gray-400 dark:text-black font-light p-2 cursor-pointer"
          >
            <p>Log out</p>
          </a>
        </div>
      </aside>

      <!-- Section for personal posts -->
      <section
        class="bg-customGray dark:bg-indigo-100 p-4 rounded-lg w-full md:w-3/4 flex flex-col"
      >
        <h2 class="text-gray-400 dark:text-black mb-2">Your personal posts:</h2>
        <div class="grid grid-cols-1">
          <div id="personal-posts" class="flex flex-col space-y-4">
            <div
              class="animate-pulse space-y-8 md:space-y-0 md:space-x-8 md:flex md:items-center flex-col"
            >
              <div class="w-full">
                <div
                  class="h-2.5 bg-gray-200 rounded-full dark:bg-gray-700 w-48 mb-4"
                ></div>
                <div
                  class="h-2 bg-gray-200 rounded-full dark:bg-gray-700 max-w-[480px] mb-2.5"
                ></div>
                <div
                  class="h-2 bg-gray-200 rounded-full dark:bg-gray-700 mb-2.5"
                ></div>
                <div
                  class="h-2 bg-gray-200 rounded-full dark:bg-gray-700 max-w-[440px] mb-2.5"
                ></div>
                <div
                  class="h-2 bg-gray-200 rounded-full dark:bg-gray-700 max-w-[460px] mb-2.5"
                ></div>
              </div>
              <div
                class="flex items-center justify-center w-full h-100 bg-gray-300 rounded-sm sm:w-96 dark:bg-gray-700 mt-4"
              >
                <svg
                  class="w-100 h-100 text-gray-200 dark:text-gray-600"
                  aria-hidden="true"
                  xmlns="http://www.w3.org/2000/svg"
                  fill="currentColor"
                  viewBox="0 0 20 18"
                >
                  <path
                    d="M18 0H2a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2Zm-5.5 4a1.5 1.5 0 1 1 0 3 1.5 1.5 0 0 1 0-3Z"
                  />
                </svg>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <footer class="bg-customTeal text-gray-300 py-10 mt-48 bottom-0 w-full">
      <div class="container mx-auto px-6 lg:px-8">
        <div class="flex flex-col md:flex-row md:justify-between">
          <div class="mb-6 md:mb-0">
            <img
              src="/images/fuzzbuzz-logo.png"
              alt="fuzzbuzz logo"
              class="w-24"
            />
            <p class="mt-2 text-gray-200">
              We have something fuzzy you can buzz about!
            </p>
          </div>

          <div class="flex space-x-10">
            <div>
              <h2 class="font-semibold text-white">Pages</h2>
              <ul class="mt-4 space-y-2">
                <li>
                  <a href="#profile" class="hover:text-white">Profile</a>
                </li>
                <li>
                  <a href="/feed.html" class="hover:text-white">Feed</a>
                </li>
                <li>
                  <a href="/" class="hover:text-white">Log out</a>
                </li>
              </ul>
            </div>
          </div>
        </div>

        <div class="mt-10 text-center text-gray-300">
          <p>&copy; 2024 FuzzBuzz | All rights reserved.</p>
        </div>
      </div>
    </footer>
  </body>
</html>
